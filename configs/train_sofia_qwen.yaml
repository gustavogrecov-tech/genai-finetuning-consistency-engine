---
job: extension
config:
  name: "sofia_qwen_lora"
  process:
    - type: 'sd_trainer'
      training_folder: "/workspace/output_lora"
      device: cuda:0
      trigger_word: "sofia_woman"
      network:
        type: "lora"
        linear: 32
        linear_alpha: 32
      save:
        dtype: float16
        save_every: 250
        max_step_saves_to_keep: 4
      datasets:
        - folder_path: "/workspace/dataset_sofia"
          caption_ext: "txt"
          caption_dropout_rate: 0.05
          shuffle_tokens: false
          cache_latents_to_disk: true
          resolution: [ 512, 768, 1024 ]
      train:
        batch_size: 1
        cache_text_embeddings: true
        steps: 1000
        gradient_accumulation: 1
        train_unet: true
        train_text_encoder: false
        gradient_checkpointing: true
        noise_scheduler: "flowmatch"
        optimizer: "adamw8bit"
        lr: 1e-4
        skip_first_sample: true
        dtype: bf16
      model:
        name_or_path: "Qwen/Qwen-Image"
        arch: "qwen_image"
        quantize: true
        qtype: "uint3|ostris/accuracy_recovery_adapters/qwen_image_torchao_uint3.safetensors"
        quantize_te: true
        qtype_te: "qfloat8"
        low_vram: false
      sample:
        sampler: "flowmatch"
        sample_every: 250
        sample_start_step: 250
        width: 1024
        height: 1024
        prompts:
          - "close-up portrait photo of sofia_woman, looking directly at the camera, symmetrical striking light blue eyes, subtle freckles on nose and cheeks, soft natural pink lips slightly parted showing upper teeth, long straight blonde hair parted in the middle, studio lighting"
          - "portrait photo of sofia_woman wearing an elegant dark blazer, soft natural lighting, photorealistic 8k, ultra-detailed skin texture"
          - "photo of sofia_woman in a red summer dress, golden hour sunset, cinematic"
        neg: "ugly, blurry, low quality, distorted, bad anatomy, deformed eyes"
        seed: 42
        walk_seed: true
        guidance_scale: 3.5
        sample_steps: 25
meta:
  name: "sofia_qwen_lora"
  version: '1.0'
